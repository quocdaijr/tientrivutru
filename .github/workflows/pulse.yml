name: Pulse

on:
  workflow_dispatch:
  schedule:
    # Three runs a day, three cards. These times are requests, not appointments: GitHub
    # has started this repo's crons 3-10 hours late, so cards land somewhere between late
    # morning and late evening VN. Early UTC slots keep even a 10-hour delay on the same VN
    # day. Every run that does start sends one card; `--run` (the run number) picks which,
    # and `pulse.RUNS_PER_DAY` must equal the number of lines here.
    - cron: '0 0 * * *'
    - cron: '0 3 * * *'
    - cron: '0 6 * * *'

# Read-only on purpose. This job commits nothing, which is what keeps a birth date
# supplied through a secret from ever reaching the repository.
permissions:
  contents: read

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # v7 for the same reason as ci.yml: astral-sh stopped publishing floating major
        # tags after it, so `@v10` is not a ref that resolves.
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      # `|| true` for the same reason as the notify step in oracle.yml: a dead bot, an
      # unset secret or a rate limit is not a reason to paint this run red. Missing
      # Telegram config exits 1 by design, and that must stay a non-event here.
      - name: Pulse
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional, and never committed anywhere. `pulse` reports a malformed value by
          # naming the variable and nothing else, because these logs are public.
          TIENTRIVUTRU_BIRTH_DATE: ${{ secrets.TIENTRIVUTRU_BIRTH_DATE }}
          TIENTRIVUTRU_GENDER: ${{ secrets.TIENTRIVUTRU_GENDER }}
          TIENTRIVUTRU_NAME: ${{ secrets.TIENTRIVUTRU_NAME }}
        run: |
          uv run tientrivutru pulse --run ${{ github.run_number }} || true
