name: Oracle

on:
  workflow_dispatch:
  schedule:
    # 10:00 VN - well before the 18:00 draw, so prophecies are committed in advance.
    - cron: '0 3 * * *'
    # 18:45 VN - after the draw, to ingest the result and update the scoreboard.
    - cron: '45 11 * * *'

# Every data step below is idempotent, so running the full sequence at both times is
# safe and simpler than branching on which cron fired:
#   - ingest never rewrites an existing draw
#   - oracle refuses to duplicate a prophecy, or to prophesy a settled draw
#   - score and site are derived purely from draws + prophecies
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: oracle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      # A gap or upstream lag exits non-zero on purpose. That is a warning about
      # someone else's mirror, not a reason to abandon the run - and `ingest` already
      # tries vietlott.vn as a fallback before reporting a gap as unresolved.
      - name: Ingest results
        run: uv run tientrivutru ingest --check-gaps || true

      - name: Prophesy
        run: uv run tientrivutru oracle

      - name: Score
        run: uv run tientrivutru score

      - name: Build site bundle
        run: uv run tientrivutru site

      - name: Step summary
        run: |
          {
            echo '```'
            uv run tientrivutru today
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit data
        run: |
          git config user.name  "tientrivutru-oracle"
          git config user.email "oracle@tientrivutru.invalid"
          git add data/ site/data.json
          if git diff --staged --quiet; then
            echo "Vu tru khong noi gi moi hom nay."
          else
            git commit -m "oracle: $(date -u +%F) — vũ trụ đã lên tiếng"
            git push
          fi

      # Telegram is a convenience, never a gatekeeper: `|| true` keeps a dead bot or
      # an unset secret from failing a run whose data work already succeeded.
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event.schedule }}" = "45 11 * * *" ]; then
            uv run tientrivutru notify --kind result || true
          else
            uv run tientrivutru notify --kind prophecy || true
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # This job was continue-on-error while the repo was private, because Pages is
  # unavailable on a private repo under the free plan and the data pipeline still had to
  # report green. The repo is public now and Pages works, so the flag has been removed:
  # all it would do today is hide a real deploy failure behind a green tick, which is the
  # exact failure mode this project exists to avoid.
  deploy-pages:
    needs: run
    runs-on: ubuntu-latest
    # Shared with the CI workflow's deploy job - Pages allows one deployment in flight.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
