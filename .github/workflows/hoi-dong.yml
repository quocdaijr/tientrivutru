name: Hội đồng

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Họp thật nhưng không ghi gì vào sổ, không commit, không deploy"
        type: boolean
        default: false
      asset:
        description: "Chỉ một mã (chỉ dùng cùng dry_run), vd BTC-USD"
        type: string
        default: ""
  # 10:30 UTC = 17:30 in Vietnam: after HOSE's 15:00 close and well after Gemini's daily quota
  # resets at midnight Pacific. oracle.yml's 11:45 run shares the `oracle` concurrency group, so
  # the two queue rather than race for main. Unattended on purpose: Google's
  # Gemini API terms, unlike OpenAI's and Anthropic's, ask for no per-item review (ticket 12).
  # Measured on the free tier with gemini-3.5-flash-lite (2026-09-23): one sitting = 21 calls,
  # ~128K tokens in, ~97 s; four assets = 84 of the 500 requests a day the tier allows.
  schedule:
    - cron: '30 10 * * *'

# Serialised with oracle.yml: both rebuild and commit site/data.json, and two pushes racing
# for main is how one of them silently loses its data.
concurrency:
  group: oracle
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      # The Council's memory (ticket 09): TradingAgents' decision log - past decisions in model
      # prose, and the returns they earned from Yahoo prices. Neither may be committed, so it
      # lives in the Actions cache instead. A cache entry is immutable, so every recorded run
      # saves a new one and the next run restores the newest by prefix. GitHub evicts an entry
      # unused for 7 days: a Council that stops sitting for a week starts over, and the page
      # counts its verdicts as remembering only from the rows that say so.
      - name: Restore the Council's memory
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/hoi-dong-memory
          key: hoi-dong-memory-${{ github.run_id }}
          restore-keys: hoi-dong-memory-

      # TradingAgents is not a dependency of this package. It is layered in for this one step,
      # at the exact commit of its v0.5.0 tag - never by name from PyPI, where `tradingagents`
      # is a different project by a different author.
      #
      # One secret holds the key; the variable HOI_DONG_KEY_ENV names the env var the chosen
      # provider reads (GOOGLE_API_KEY, DEEPSEEK_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY),
      # so switching provider never means editing this file. FRED_API_KEY stays unset: FRED
      # series owned by third parties would need their owners' permission.
      #
      # `council` exits 2 and spends nothing unless model, price and cap are all set; exits 1
      # if a sitting failed, after writing its row - so the steps below still run and commit
      # it, and the job goes red afterwards instead of hiding the failure.
      - name: Council sits
        id: council
        env:
          HOI_DONG_API_KEY: ${{ secrets.HOI_DONG_API_KEY }}
          HOI_DONG_KEY_ENV: ${{ vars.HOI_DONG_KEY_ENV }}
          HOI_DONG_MONTHLY_CAP_USD: ${{ secrets.HOI_DONG_MONTHLY_CAP_USD }}
          # "free" on a project with no billing (Gemini's free tier): nothing can be charged,
          # so the provider's own limit is the cap and no dollar cap is needed.
          HOI_DONG_BILLING: ${{ vars.HOI_DONG_BILLING }}
          # A dry run sits on a copy of this file, so a trial never becomes a memory.
          HOI_DONG_MEMORY_PATH: ${{ runner.temp }}/hoi-dong-memory/trading_memory.md
          # A free tier answers bursts with 429. TradingAgents forwards this retry budget to
          # every provider client (its own knob for exactly this, upstream #1091).
          TRADINGAGENTS_LLM_MAX_RETRIES: "6"
          TRADINGAGENTS_LLM_PROVIDER: ${{ vars.HOI_DONG_PROVIDER }}
          TRADINGAGENTS_DEEP_THINK_LLM: ${{ vars.HOI_DONG_MODEL }}
          TRADINGAGENTS_QUICK_THINK_LLM: ${{ vars.HOI_DONG_MODEL }}
        run: |
          if [ -n "$HOI_DONG_KEY_ENV" ]; then export "$HOI_DONG_KEY_ENV=$HOI_DONG_API_KEY"; fi
          unset HOI_DONG_API_KEY
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then args+=(--dry-run); fi
          if [ -n "${{ inputs.asset }}" ]; then args+=(--asset "${{ inputs.asset }}"); fi
          uv run --with "tradingagents @ git+https://github.com/TauricResearch/TradingAgents@2d17df8da1536c121e4d7395ac5a5dcec9e96d6f" \
            tientrivutru council "${args[@]}"

      # Saved even after a failed sitting: the others' decisions are in it. Never after a dry
      # run - it sat on a copy, but a save here is the only way a trial could leak in anyway.
      - name: Keep the Council's memory
        if: ${{ !cancelled() && !inputs.dry_run }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/hoi-dong-memory
          key: hoi-dong-memory-${{ github.run_id }}

      # A dry run writes nothing, so there is nothing to bundle, commit or deploy.
      - name: Build site bundle
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: uv run tientrivutru site

      - name: Commit verdicts
        if: ${{ !cancelled() && !inputs.dry_run }}
        run: |
          git config user.name  "tientrivutru-hoi-dong"
          git config user.email "hoi-dong@tientrivutru.invalid"
          git add data/hoi_dong site/data.json
          if git diff --staged --quiet; then
            echo "Hội đồng không ghi gì mới."
            exit 0
          fi
          git commit -m "hoi-dong: $(date -u +%F) — hội đồng đã họp"
          git pull --rebase
          git push

      - name: Upload Pages artifact
        if: ${{ !cancelled() && !inputs.dry_run }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-pages:
    needs: run
    if: ${{ !cancelled() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Shared with ci.yml and oracle.yml - Pages allows one deployment in flight.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
